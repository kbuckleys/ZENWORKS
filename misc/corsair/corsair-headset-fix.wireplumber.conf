# ┌─┐┌─┐┌┐┌┬ ┬┌─┐┬─┐┬┌─┌─┐
# ┌─┘├┤ │││││││ │├┬┘├┴┐└─┐
# └─┘└─┘┘└┘└┴┘└─┘┴└─┴ ┴└─┘
# https://github.com/kbuckleys/
# corsair-headset-fix — WirePlumber node rules
#
# setup.sh symlinks this to
#   ~/.config/wireplumber/wireplumber.conf.d/51-corsair-headset-fix.conf
# and WirePlumber only reads it at start, so after editing:
#   systemctl --user restart wireplumber pipewire pipewire-pulse
#
# The symptom: intermittent crackling on the VOID ELITE adapter that only a
# profile cycle would clear. A profile cycle closes and reopens the ALSA PCM,
# so whatever breaks is the stream state, not the audio going into it.
#
# session.suspend-timeout-seconds = 0
#   Never suspend the node. PipeWire closes an idle sink after 5 s, and the
#   crackle tends to start after it reopens: the adapter is full-speed USB
#   (12 Mb/s, UAC1) and its stream can come back with the rate feedback out
#   of step.
#
# api.alsa.period-size / api.alsa.headroom = 1024
#   The graph's min-quantum is 32 frames, and a low-latency client drags the
#   whole graph toward it. A full-speed device cannot be serviced that often
#   reliably; every underrun is an audible click. ~20 ms of added latency on
#   this device only.
#
# device.profile.priority.rules
#   Analog Stereo Duplex first, so the card never comes up on its digital
#   (iec958) or `off` profile. Only consulted when WirePlumber has no SAVED
#   profile for the card — a remembered one wins, which is why the
#   corsair-headset-fix script still checks and corrects it at login/replug.
#
# Matched by node name, which the adapter's USB strings produce (the vendor
# misspelling "Cosair" is the firmware's, not a typo here).

monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_output.usb-Cosair_Corsair_VOID_ELITE.*" }
      { node.name = "~alsa_input.usb-Cosair_Corsair_VOID_ELITE.*" }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 0
        api.alsa.period-size = 1024
        api.alsa.headroom = 1024
      }
    }
  }
]

device.profile.priority.rules = [
  {
    matches = [
      { device.name = "~alsa_card.usb-Cosair_Corsair_VOID_ELITE.*" }
    ]
    actions = {
      update-props = {
        priorities = [
          "output:analog-stereo+input:analog-stereo"
          "output:analog-stereo"
        ]
      }
    }
  }
]
