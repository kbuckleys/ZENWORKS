# ┌─┐┌─┐┌┐┌┬ ┬┌─┐┬─┐┬┌─┌─┐
# ┌─┘├┤ │││││││ │├┬┘├┴┐└─┐
# └─┘└─┘┘└┘└┴┘└─┘┴└─┴ ┴└─┘
# https://github.com/kbuckleys/
# corsair-headset-fix — snd-usb-audio per-device quirks
#
# The VOID ELITE adapter (1b1c:0a53) has no entry in the kernel's builtin
# usb_audio_quirk_flags_table, so its quirks have to be set by module param.
#
# Syntax (snd_usb_init_quirk_flags_parse_string, sound/usb/quirks.c):
#   VID:PID:FLAG[|FLAG…][;VID:PID:FLAG…]
# ':' splits VID/PID/flags, ';' ends an entry, '|' splits flags. '*' wildcards
# a VID or PID, '!FLAG' clears one. An unrecognised name is skipped with
# "snd_usb_audio: unknown flag %s while parsing param quirk_flags" — grep dmesg
# for that after editing, it does not otherwise fail loudly.
#
# GET_SAMPLE_RATE ("skip reading sample rate")
#   After setting the rate, the driver reads it back with a UAC1 GET_CUR
#   SAMPLING_FREQ_CONTROL request. This firmware never answers it, so every
#   time the analog playback endpoint is opened — USB enumeration, WirePlumber
#   acquiring the card at login, a profile switch — the kernel logs
#     usb 1-5: 2:1: cannot get freq at ep 0x1
#   The failure is cosmetic: snd_usb_init_sample_rate() ignores it and the
#   endpoint runs at 48 kHz anyway. But it is logged at dev_err/KERN_ERR (3),
#   which is below console_loglevel 4, so it lands on the tty at every login.
#   This flag returns before the read-back and the message goes away.
#
# MIXER_PLAYBACK_LINEAR_VOL — TRIED, REJECTED. Do not re-add.
#   The kernel warns about this device:
#     usb 1-5: Warning! Unlikely big volume step count (=4096), linear volume
#              or wrong cval->res?
#   It guesses wrong. numid=7 is not voltage-linear, it is a 0…+16 dB makeup
#   gain that happens to have 4096 absurdly fine steps. The flag is scoped per
#   *device*, not per control, so it rewrites both playback controls:
#
#     numid=7 (index 0, raw 0..4096)   0.00…16.00 dB  →  -99999.99…0.00 dB
#     numid=9 (index 1, raw 0..55)   -50.00…5.00 dB  →  -99999.99…0.00 dB
#
#   Both descriptions are then false, and numid=9's was correct to begin with.
#   PipeWire drives numid=7 believing raw 12 is -51 dB when it is really unity
#   gain — already full loudness. Result: the device's entire real range gets
#   squeezed into the bottom ~6% of the slider and the rest does nothing.
#
#   Base Volume does move to a tidy 100% / 0.00 dB, which looks like a win in
#   `pactl list sinks`. Ignore that: it is 100% of a range that isn't real.

options snd-usb-audio quirk_flags=1b1c:0a53:GET_SAMPLE_RATE
